name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The test suites run one test at a time (the end-to-end tests start
  # servers), so each compiler gets its own job, and the limits leave room
  # for the hosted runners' four cores.
  linux:
    name: Linux (GCC 16)
    runs-on: ubuntu-latest
    # Debian trixie: OpenSSL 3.5, CMake 3.31.
    container: gcc:16-trixie
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: .github/scripts/install-linux-tools.sh

      - name: GCC 16
        run: |
          cmake --preset gcc-debug -DCMAKE_CXX_COMPILER=g++
          cmake --build --preset gcc-debug
          ctest --preset gcc-debug

      - name: GCC 16 release (as the Docker image builds it, with the Bo compiler)
        run: |
          cmake --preset gcc-release -DCMAKE_CXX_COMPILER=g++ -DCEXCHAIN_BUILD_TESTS=OFF \
              -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build --preset gcc-release --target cexchain
          build/gcc-release/cli/cexchain version
          build/gcc-release/cli/cexchain bo packs list

  address-sanitizer:
    name: Linux (Clang 23 with sanitizers)
    runs-on: ubuntu-latest
    container: gcc:16-trixie
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: .github/scripts/install-linux-tools.sh

      # Clang has no C++26 reflection or contracts yet: it builds everything
      # but the Bo compiler proper, its front end included.
      - name: Clang 23 with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake --preset clang-asan -DCMAKE_CXX_COMPILER=clang++-23
          cmake --build --preset clang-asan
          ctest --preset clang-asan

      - name: Formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files '*.cpp' '*.hpp' | xargs clang-format-23 --dry-run --Werror

  bo-sanitizers:
    # The Bo compiler is C++26 with reflection and contracts, which only GCC
    # builds: its sanitizer run is GCC's. It builds the Bo tests alone.
    name: Linux (GCC 16 with sanitizers, the Bo compiler)
    runs-on: ubuntu-latest
    container: gcc:16-trixie
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: .github/scripts/install-linux-tools.sh

      - name: GCC 16 with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake --preset gcc-asan -DCMAKE_CXX_COMPILER=g++
          cmake --build --preset gcc-asan
          ctest --preset gcc-asan

  thread-sanitizer:
    name: Linux (Clang 23 with ThreadSanitizer)
    runs-on: ubuntu-latest
    container: gcc:16-trixie
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: .github/scripts/install-linux-tools.sh

      - name: Clang 23 with ThreadSanitizer
        run: |
          cmake --preset clang-tsan -DCMAKE_CXX_COMPILER=clang++-23
          cmake --build --preset clang-tsan
          ctest --preset clang-tsan

  browser-verifier:
    name: Browser verifier (WebAssembly)
    runs-on: ubuntu-latest
    container: gcc:16-trixie
    timeout-minutes: 40
    defaults:
      run:
        # emsdk_env.sh finds its own directory only when sourced from bash.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          .github/scripts/install-linux-tools.sh
          .github/scripts/install-emscripten.sh

      - name: Build the native tool and the WebAssembly verifier
        run: |
          cmake --preset gcc-debug -DCMAKE_CXX_COMPILER=g++ -DCEXCHAIN_BUILD_TESTS=OFF
          cmake --build --preset gcc-debug --target cexchain
          . /opt/emsdk/emsdk_env.sh
          tools/wasm/build.sh build/wasm

      - name: Test in Node.js and Chromium
        run: |
          . /opt/emsdk/emsdk_env.sh
          cd tests/browser
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          cd ../..
          REQUIRE_BROWSER=1 tests/browser/run.sh build/gcc-debug/cli/cexchain build/wasm

      - name: Keep the verifier page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cexchain-verify
          path: build/wasm/cexchain-verify.html
