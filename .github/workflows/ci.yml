name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (GCC 16; Clang 23 with sanitizers)
    runs-on: ubuntu-latest
    # Debian trixie: OpenSSL 3.5, CMake 3.31.
    container: gcc:16-trixie
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: .github/scripts/install-linux-tools.sh

      - name: GCC 16
        run: |
          cmake --preset gcc-debug -DCMAKE_CXX_COMPILER=g++
          cmake --build --preset gcc-debug
          ctest --preset gcc-debug

      - name: Clang 23 with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake --preset clang-asan -DCMAKE_CXX_COMPILER=clang++-23
          cmake --build --preset clang-asan
          ctest --preset clang-asan

      - name: Formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files '*.cpp' '*.hpp' | xargs clang-format-23 --dry-run --Werror

  browser-verifier:
    name: Browser verifier (WebAssembly)
    runs-on: ubuntu-latest
    container: gcc:16-trixie
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          .github/scripts/install-linux-tools.sh
          .github/scripts/install-emscripten.sh

      - name: Build the native tool and the WebAssembly verifier
        run: |
          cmake --preset gcc-debug -DCMAKE_CXX_COMPILER=g++ -DCEXCHAIN_BUILD_TESTS=OFF
          cmake --build --preset gcc-debug --target cexchain
          . /opt/emsdk/emsdk_env.sh
          tools/wasm/build.sh build/wasm

      - name: Test in Node.js and Chromium
        run: |
          . /opt/emsdk/emsdk_env.sh
          cd tests/wasm
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          cd ../..
          REQUIRE_BROWSER=1 tests/wasm/run.sh build/gcc-debug/cli/cexchain build/wasm

      - name: Keep the verifier page
        uses: actions/upload-artifact@v4
        with:
          name: cexchain-verify
          path: build/wasm/cexchain-verify.html
