name: Fuzz

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each fuzz target
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    name: libFuzzer
    runs-on: ubuntu-latest
    container: gcc:16-trixie
    # Every target runs SECONDS_PER_TARGET in turn (21 targets: 105 minutes at
    # the default), after builds of about 25 minutes.
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: .github/scripts/install-linux-tools.sh

      - name: Build fuzz targets
        run: |
          cmake --preset clang-fuzz -DCMAKE_CXX_COMPILER=clang++-23
          cmake --build --preset clang-fuzz

      - name: Run fuzz targets
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
          # Long runs otherwise grow RSS through allocator retention alone (live
          # heap stays small), which libFuzzer misreports as out-of-memory.
          # A single allocation over 256 MB still fails the run.
          ASAN_OPTIONS: allocator_release_to_os_interval_ms=1000:quarantine_size_mb=64
        run: |
          # Valid objects to start from: random bytes rarely pass a signature.
          build/clang-fuzz/fuzz/make_seeds corpus
          for target in build/clang-fuzz/fuzz/*_fuzz; do
            echo "::group::$(basename "$target")"
            mkdir -p "corpus/$(basename "$target")"
            "$target" "corpus/$(basename "$target")" -max_total_time="$SECONDS_PER_TARGET" \
              -rss_limit_mb=4096 -malloc_limit_mb=256
            echo "::endgroup::"
          done

      # Lowering needs C++26 reflection (GCC) and libFuzzer needs Clang, so the
      # Bo compiler's build fuzzer is a GCC program that drives itself from a
      # contract generator (fuzz/bo_build_fuzz.cpp), here with ASan and UBSan.
      - name: Run the Bo build fuzzer (GCC)
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        run: |
          cmake --preset gcc-asan -DCMAKE_CXX_COMPILER=g++
          cmake --build --preset gcc-asan --target bo_build_fuzz
          build/gcc-asan/tests/bo_build_fuzz -max_total_time="$SECONDS_PER_TARGET" \
            -seed="$GITHUB_RUN_NUMBER"

      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            bo-build-crash.bin
            crash-*
            leak-*
            timeout-*
            oom-*
