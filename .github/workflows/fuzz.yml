name: Fuzz

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each fuzz target
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    name: libFuzzer
    runs-on: ubuntu-latest
    container: gcc:16-trixie
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: .github/scripts/install-linux-tools.sh

      - name: Build fuzz targets
        run: |
          cmake --preset clang-fuzz -DCMAKE_CXX_COMPILER=clang++-23
          cmake --build --preset clang-fuzz

      - name: Run fuzz targets
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        run: |
          for target in build/clang-fuzz/fuzz/*_fuzz; do
            echo "::group::$(basename "$target")"
            mkdir -p "corpus/$(basename "$target")"
            "$target" "corpus/$(basename "$target")" -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048
            echo "::endgroup::"
          done

      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*
